    <script>
      const customBullets = [
        `

      ];
      const mainSlider = new Swiper(".main-visual", {
        loop: true,
        speed: 1000,
        effect: "fade",
        pagination: {
          el: ".main-visual .pagination",
          clickable: true,
          renderBullet: function (index, className) {
            return `<div class="${className}"><div>나는 문자로 출력됩니다. ${index}</div></div>`;
